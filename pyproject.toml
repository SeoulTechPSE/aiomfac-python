[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aiomfac_py"
version = "1.0.1"
description = "Pure-Python port of the AIOMFAC thermodynamic activity-coefficient model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
test = ["pytest>=7"]
# needed only for aiomfac_py.carbonate (bicarbonate/bisulfate dissociation equilibria, uses scipy.optimize.root)
carbonate = ["scipy>=1.9"]
# needed only for aiomfac_py.s2as (SMILES -> AIOMFAC subgroups, uses the Indigo cheminformatics toolkit)
smiles = ["epam.indigo"]
# needed only for aiomfac_py.tgml_armeli.predict_tg_ml_fg / predict_tg_ml_smiles (Armeli, Peters and Koop,
# 2023, ML Tg predictor). Installs normally alongside the rest of aiomfac_py -- the vendored trained model
# files were migrated (see tgml_armeli/PROVENANCE.md and tools/migrate_tgml_pickles.py) so any reasonably
# current scikit-learn can load them directly; no special environment or version pin needed any more.
tgml = ["scikit-learn>=1.1"]
# further needed only for aiomfac_py.tgml_armeli.predict_tg_ml_smiles specifically (SMILES-string input).
# Any reasonably current rdkit works (descriptors are looked up by name, not position -- see
# tgml_armeli/__init__.py docstring); pin rdkit-pypi==2022.3.2.1 yourself instead if you need byte-exact
# reproduction of A2023's own reported numbers (see that docstring for the one known small discrepancy).
tgml-smiles = ["rdkit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aiomfac_py = ["data/*.npz", "s2as/LICENSE_S2AS", "tgml_armeli/data/*.pkl", "tgml_armeli/PROVENANCE.md",
              "tgml_armeli/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
