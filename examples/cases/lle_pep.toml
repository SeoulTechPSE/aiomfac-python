title = "water + pinic acid + ammonium sulfate at fixed total composition (UHAERO-type interior point)"

[calculation]
mode = "lle"

[system]
T_K = 298.15

[[system.organics]]
name = "pinic_acid"
subgroups = [[1, 2], [2, 2], [3, 2], [4, 1], [137, 2]]

[feed]                             # mol; water is closed (fixed amount)
Water = 0.6
pinic_acid = 0.3

[salts]
"(NH4)2SO4" = 0.1

[solver]
engine = "pep"
